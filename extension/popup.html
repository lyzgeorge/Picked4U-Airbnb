<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { width: 340px; margin: 0; padding: 16px; font: 14px/1.4 -apple-system, system-ui, sans-serif; color: #222; }
  h1 { font-size: 17px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
  label { display: block; font-weight: 600; margin: 10px 0 4px; }
  input[type=text], input[type=password], textarea { width: 100%; box-sizing: border-box; padding: 8px;
    border: 1px solid #b0b0b0; border-radius: 8px; font: inherit; }
  textarea { height: 110px; resize: vertical; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .presets button { border: 1px solid #b0b0b0; background: #fff; border-radius: 16px; padding: 4px 10px; font: inherit;
    font-size: 12px; cursor: pointer; }
  .presets button:hover { border-color: #222; }
  .saved { color: #008a05; font-size: 12px; height: 16px; margin-top: 6px; }
  details { margin-top: 12px; } summary { cursor: pointer; color: #555; }
</style>
</head>
<body>
<h1>Picked 4 U <label style="margin:0;font-weight:400"><input id="enabled" type="checkbox"> On</label></h1>
<label for="preference">What do you like in a stay?</label>
<textarea id="preference" placeholder="e.g. quiet at night, good wifi, close to the Luas"></textarea>
<div class="presets">
  <button data-p="0">Light sleeper, work trip</button>
  <button data-p="1">Weekend with friends</button>
  <button data-p="2">Family with young kids</button>
</div>
<div class="saved" id="saved"></div>
<details id="conn">
  <summary>Connection</summary>
  <label for="backendUrl">Backend URL</label><input id="backendUrl" type="text" placeholder="https://your-domain">
  <label for="apiToken">API token</label><input id="apiToken" type="password">
</details>
<script src="popup.js"></script>
</body>
</html>
